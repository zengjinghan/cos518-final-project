lsm:
  params: # param-level sweeps (field -> list of values)
    write_buffer_size: [131072, 262144, 524288, 1048576, 2097152]
    max_l0_files: [4, 8, 12]
    max_bytes_for_level_multiplier: [5, 10, 100]
    enable_bloom_filter: [true, false]

  variants: [] # optional: fully specified configs (overrides base)

disk:
  params:
    type:
      - in_memory
  variants: []

compaction:
  params:
    type:
      - tiered
      - leveled
      - fifo
  variants: []

workload:
  params:
    type:
      - zipf
      - skewed
      - uniform
  variants: []
