name: base_1
repetitions: 1

lsm:
  write_buffer_size: 524288
  target_file_size_base: 524288
  max_l0_files: 4
  max_bytes_for_level_base: 12000000
  max_bytes_for_level_multiplier: 10
  write_ahead_log_path: null
  bloom_filter:
    type: bloom
    args:
      expected_items: 20000
      false_positive_rate: 0.001

disk:
  type: in_memory
  args: {}

compaction:
  type: leveled
  args: {}

workload:
  type: uniform
  n_ops: 2000000
  key_range: 20000
  value_range: 100000
  key_size_bytes: 8
  value_size_bytes: 100
  put_fraction: 0.75
  get_fraction: 0.25
  get_existing_keys_only: true
  seed: 42
  params: {}
